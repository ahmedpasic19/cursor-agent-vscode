<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Agent — webview harness</title>
    <style>
      /* Approximation of VS Code Dark+ tokens so the webview renders outside VS Code. */
      :root {
        --vscode-font-family: system-ui, 'Segoe UI', sans-serif;
        --vscode-font-size: 13px;
        --vscode-editor-font-family: Consolas, 'Courier New', monospace;
        --vscode-foreground: #cccccc;
        --vscode-descriptionForeground: #9d9d9d;
        --vscode-sideBar-background: #181818;
        --vscode-input-background: #313131;
        --vscode-input-foreground: #cccccc;
        --vscode-input-border: #3c3c3c;
        --vscode-input-placeholderForeground: #989898;
        --vscode-focusBorder: #0078d4;
        --vscode-panel-border: #2b2b2b;
        --vscode-textLink-foreground: #4daafc;
        --vscode-textCodeBlock-background: #2b2b2b;
        --vscode-button-background: #0078d4;
        --vscode-button-foreground: #ffffff;
        --vscode-button-hoverBackground: #026ec1;
        --vscode-button-secondaryBackground: #313131;
        --vscode-button-secondaryForeground: #cccccc;
        --vscode-button-secondaryHoverBackground: #3c3c3c;
        --vscode-dropdown-background: #313131;
        --vscode-dropdown-foreground: #cccccc;
        --vscode-dropdown-border: #3c3c3c;
        --vscode-badge-background: #616161;
        --vscode-badge-foreground: #f8f8f8;
        --vscode-list-hoverBackground: #2a2d2e;
        --vscode-toolbar-hoverBackground: #5a5d5e50;
        --vscode-errorForeground: #f85149;
        --vscode-inputValidation-errorBorder: #be1100;
        --vscode-inputValidation-errorBackground: #5a1d1d;
        --vscode-progressBar-background: #0078d4;
        --vscode-charts-green: #89d185;
        --vscode-textBlockQuote-border: #616161;
      }
      body { margin: 0; }
      #frame { width: 420px; height: 100vh; border-right: 1px solid #333; }
    </style>
  </head>
  <body>
    <div id="frame"><div id="root" style="height: 100%"></div></div>
    <script type="module" src="./src/harness.ts"></script>
  </body>
</html>
